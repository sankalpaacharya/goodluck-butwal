name: Skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Agent Skills
        run: |
          set -euo pipefail
          for skill in .agents/skills/*/; do
            echo "Validating $skill"
            npx -y skills-ref@0.1.5 validate "$skill"
          done
